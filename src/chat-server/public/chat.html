<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashFly Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        
        .chat-header {
            background: linear-gradient(135deg, #0D2440 0%, #2E5E99 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .online-count {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.own {
            align-self: flex-end;
            background: #2E5E99;
            color: white;
        }

        .message.other {
            align-self: flex-start;
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .message.system {
            align-self: center;
            background: #E7F0FA;
            color: #0D2440;
            font-size: 12px;
            padding: 6px 16px;
        }

        .message.proprietaire {
            border-left: 4px solid #ffc107;
        }

        .message.proprietaire.other {
            background: linear-gradient(135deg, #fff9e6 0%, #ffffff 100%);
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .message.own .message-header {
            color: rgba(255,255,255,0.8);
        }

        .message.other .message-header {
            color: #666;
        }

        .role-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .role-proprietaire {
            background: #ffc107;
            color: #0D2440;
        }

        .role-investisseur {
            background: #28a745;
            color: white;
        }

        .crown-badge {
            color: #ffc107;
            font-size: 14px;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-time {
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.7;
        }

        
        .typing-indicator {
            align-self: flex-start;
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 12px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        
        .input-container {
            background: white;
            padding: 15px 20px;
            border-top: 1px solid #e0e4e8;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            border: 1px solid #e0e4e8;
            border-radius: 24px;
            padding: 12px 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #2E5E99;
        }

        .send-btn {
            background: #2E5E99;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #1e4a7a;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        
        .connection-status {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #dc3545;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 100;
        }

        .connection-status.offline {
            display: block;
        }

        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e4e8;
            border-top-color: #2E5E99;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body>
<div class="connection-status" id="connectionStatus">⚠️ Déconnecté</div>

<div class="chat-header">
    <h2>💬 Chat de l'événement</h2>
    <span class="online-count"><span id="onlineCount">0</span> en ligne</span>
</div>

<div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div>Connexion en cours...</div>
</div>

<div class="messages-container" id="messagesContainer" style="display: none;">
    <!-- Messages will appear here -->
</div>

<div class="typing-indicator" id="typingIndicator">
    <span id="typingUser">Quelqu'un</span> écrit
    <div class="typing-dots">
        <span></span><span></span><span></span>
    </div>
</div>

<div class="input-container" id="inputContainer" style="display: none;">
    <input type="text" class="message-input" id="messageInput"
           placeholder="Écrivez votre message..." maxlength="500" autocomplete="off">
    <button class="send-btn" id="sendBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
    </button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    // Global variables
    let socket = null;
    let auth = null;
    let typingTimeout;

    // DOM elements
    const loadingDiv = document.getElementById('loading');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const typingUser = document.getElementById('typingUser');
    const onlineCount = document.getElementById('onlineCount');
    const connectionStatus = document.getElementById('connectionStatus');
    const inputContainer = document.getElementById('inputContainer');

    // Called by JavaFX after injecting auth data
    function initChat() {

        // Get auth from window object (injected by JavaFX)
        auth = window.chatAuth;

        if (!auth) {
            console.error('No auth data found');
            showError('Données d\'authentification manquantes');
            return;
        }


        // Hide loading, show chat
        loadingDiv.style.display = 'none';
        messagesContainer.style.display = 'flex';
        inputContainer.style.display = 'flex';

        // Connect to socket
        connectSocket();
    }

    function connectSocket() {

        socket = io({
            transports: ['polling', 'websocket']
        });

        socket.on('connect', () => {
            connectionStatus.classList.remove('offline');

            // Authenticate
            const token = generateToken(auth);
            socket.emit('authenticate', {
                token: token,
                eventId: auth.eventId
            });
        });

        socket.on('disconnect', () => {
            connectionStatus.classList.add('offline');
        });

        socket.on('connect_error', (err) => {
            console.error('Connection error:', err);
            showError('Erreur de connexion: ' + err.message);
        });

        socket.on('recent_messages', (messages) => {
            messages.forEach(msg => addMessage(msg));
            scrollToBottom();
        });

        socket.on('new_message', (message) => {
            addMessage(message);
            scrollToBottom();
        });

        socket.on('user_joined', (data) => {
            addSystemMessage(data.userName + ' a rejoint le chat');
        });

        socket.on('user_left', (data) => {
            addSystemMessage(data.userName + ' a quitté le chat');
        });

        socket.on('online_users', (users) => {
            onlineCount.textContent = users.length;
        });

        socket.on('user_typing', (data) => {
            if (data.userId !== auth.userId) {
                typingUser.textContent = data.userName.replace(' 👑', '');
                typingIndicator.classList.add('active');
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    typingIndicator.classList.remove('active');
                }, 3000);
            }
        });

        socket.on('error', (data) => {
            console.error('Server error:', data);
            showError(data.message);
        });
    }

    function generateToken(authData) {
        const header = btoa(JSON.stringify({alg: 'none', typ: 'JWT'}));
        const payload = btoa(JSON.stringify({
            id: authData.userId,
            name: authData.fullName || authData.userName,
            role: authData.userRole
        }));
        return header + '.' + payload + '.';
    }

    function addMessage(msg) {
        const isOwn = msg.userId === auth.userId;
        const isProprietaire = msg.userRole === 'proprietaire';
        const div = document.createElement('div');

        div.className = `message ${isOwn ? 'own' : 'other'} ${isProprietaire ? 'proprietaire' : ''}`;

        const roleClass = isProprietaire ? 'role-proprietaire' : 'role-investisseur';
        const roleLabel = isProprietaire ? 'Propriétaire' : 'Investisseur';
        const crownBadge = isProprietaire ? '<span class="crown-badge">👑</span>' : '';

        const time = new Date(msg.timestamp).toLocaleTimeString('fr-FR', {
            hour: '2-digit',
            minute: '2-digit'
        });

        const displayName = msg.userName.replace(' 👑', '');

        div.innerHTML = `
                <div class="message-header">
                    ${crownBadge}
                    <strong>${escapeHtml(displayName)}</strong>
                    <span class="role-badge ${roleClass}">${roleLabel}</span>
                </div>
                <div class="message-content">${escapeHtml(msg.content)}</div>
                <div class="message-time">${time}</div>
            `;

        messagesContainer.appendChild(div);
    }

    function addSystemMessage(text, isError = false) {
        const div = document.createElement('div');
        div.className = 'message system';
        if (isError) div.style.background = '#ffebee';
        div.textContent = text;
        messagesContainer.appendChild(div);
        scrollToBottom();
    }

    function showError(message) {
        loadingDiv.innerHTML = `<div style="color: #dc3545;">⚠️ ${message}</div>
                <button onclick="location.reload()" style="margin-top: 10px; padding: 8px 16px;
                background: #2E5E99; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Réessayer</button>`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function sendMessage() {
        const content = messageInput.value.trim();
        if (!content || !socket) return;

        socket.emit('send_message', { content });
        messageInput.value = '';
        socket.emit('typing', { isTyping: false });
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    messageInput.addEventListener('input', () => {
        if (!socket) return;
        socket.emit('typing', { isTyping: true });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.emit('typing', { isTyping: false });
        }, 1000);
    });

    // Auto-init if auth is already available (for browser testing)
    if (window.chatAuth) {
        initChat();
    }

    // Expose initChat globally for JavaFX to call
    window.initChat = initChat;
</script>
</body>
</html>
