parameters:
    face_images_directory: '%kernel.project_dir%/public/uploads/faces'
    documents_directory: '%kernel.project_dir%/public/doc/documents'
    cashfly_events_dir: '%kernel.project_dir%/public/uploads/jpo'
    env(DEEPSEEK_NVIDIA_KEY): ''
    env(NVIDIA_API_KEY): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
